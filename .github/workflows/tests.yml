name: Python contracts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        core: ['2.8.0', '2.9.4']
    env:
      AIIDA_PATH: /tmp/itensor-contract-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest 'aiida-core==${{ matrix.core }}'
      - run: python -m pip check
      - run: python -m pytest -q tests
